name: Link Tracker

on:
  push:
    paths:
      - 'docs/*.md'
  workflow_dispatch:
    inputs:
      test_mode:
        description: 'Kirim embed dummy tanpa diff (uji webhook)'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history untuk diff)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Notify Discord link baru
        run: node .github/scripts/notify-links.cjs
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TEST_MODE: ${{ inputs.test_mode }}
